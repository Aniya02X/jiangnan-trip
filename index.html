/* ═══════════════ RESET & BASE ═══════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f7f6f2;color:#2c2c2c;-webkit-text-size-adjust:100%}

/* ═══════════════ HEADER ═══════════════ */
.hero{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;padding:48px 20px 36px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");opacity:.4}
.hero h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;position:relative;z-index:1}
.hero .sub{font-size:.85rem;color:rgba(255,255,255,.65);margin-top:6px;position:relative;z-index:1}
.hero .meta{font-size:.75rem;color:rgba(255,255,255,.5);margin-top:4px;position:relative;z-index:1}
.hero .route{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.hero .route span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:4px 14px;border-radius:20px;font-size:.78rem;font-weight:500;color:rgba(255,255,255,.85)}
.hero .route .arrow{background:transparent;border:none;color:rgba(255,255,255,.3);padding:4px 2px}

/* ═══════════════ CITY NAV ═══════════════ */
.city-nav{display:flex;gap:0;margin:-20px 16px 0;position:relative;z-index:2}
.city-btn{flex:1;padding:12px 8px;border:none;border-radius:12px 12px 0 0;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.5);color:rgba(44,44,44,.5);font-family:inherit;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.city-btn:hover{background:rgba(255,255,255,.7)}
.city-btn.active{background:#fff;color:#2c2c2c;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.city-btn .city-day{display:block;font-size:.6rem;font-weight:400;color:inherit;opacity:.6;margin-top:2px}

/* ═══════════════ DAY PILLS ═══════════════ */
.day-strip{background:#fff;padding:10px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{flex-shrink:0;padding:6px 16px;border-radius:20px;border:1.5px solid #eee;background:#fff;font-size:.75rem;font-weight:500;cursor:pointer;transition:all .18s;color:#888;white-space:nowrap;font-family:inherit}
.day-pill:hover{border-color:#0f3460;color:#0f3460}
.day-pill.active{background:#0f3460;color:#fff;border-color:#0f3460}
.day-pill .dow{font-size:.65rem;opacity:.7}

/* ═══════════════ MAP ═══════════════ */
.map-wrap{background:#fff;padding:0 16px 16px}
#map{width:100%;height:240px;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);background:#e8e4dc}

/* ═══════════════ CARDS ═══════════════ */
.content{padding:12px 16px 80px;max-width:720px;margin:0 auto}
.day-block{display:none}
.day-block.active{display:block}

.card{background:#fff;border-radius:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden}

/* Card header */
.card-hd{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f5f5f5}
.card-hd .emoji{font-size:1.1rem}
.card-hd .label{font-size:.8rem;font-weight:600;color:#555;letter-spacing:.3px}
.card-hd .tag{font-size:.62rem;padding:2px 10px;border-radius:20px;font-weight:500}
.tag-food{background:#fef3e9;color:#c76a2a}
.tag-sight{background:#e8f4ed;color:#2a8a5a}
.tag-hotel{background:#e8edf4;color:#2a5a8a}
.tag-transit{background:#f0e8f4;color:#6a2a8a}

/* Card body */
.card-bd{padding:12px 16px 14px}
.card-title{font-size:.92rem;font-weight:600;color:#2c2c2c}
.card-sub{font-size:.75rem;color:#999;margin-top:3px}

/* Meal review */
.review{margin-top:8px;padding:8px 10px;background:#fafaf8;border-radius:8px;font-size:.78rem;line-height:1.6;color:#666}
.review strong{color:#0f3460;font-weight:600}

/* Sight text */
.sight-text{font-size:.82rem;color:#666;line-height:1.6;margin-top:4px}

/* Action buttons */
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.act{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:8px;border:1px solid #eee;background:#fafafa;font-size:.74rem;cursor:pointer;color:#666;text-decoration:none;font-family:inherit;transition:all .12s;min-height:36px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.act:active{background:#f0f0f0;transform:scale(.96)}
.act.primary{background:#0f3460;color:#fff;border-color:#0f3460}
.act.primary:active{background:#0a2850}
.act .ico{font-size:.82rem}

/* Pay tags */
.pays{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.pay{font-size:.62rem;padding:2px 8px;border-radius:4px;background:#f5f5f5;color:#888;border:1px solid #eee}
.pay.cc{background:#eef4fa;color:#3a6a9a;border-color:#d0dce8}
.pay.alipay{background:#eef7ed;color:#3a7a3a;border-color:#cce0c4}
.pay.card{background:#faf4ed;color:#9a7a4a;border-color:#e8dcc4}
.pay.cash{background:#f5f0f0;color:#7a6a6a;border-color:#e0d8d0}

/* Note */
.note{padding:10px 14px;background:#fafaf8;font-size:.78rem;color:#888;line-height:1.5;border-top:1px solid #f5f5f5}

/* ═══════════════ FOOTER ═══════════════ */

/* ═══════════════ RESPONSIVE ═══════════════ */
@media(min-width:640px){
  .hero{padding:64px 20px 48px}
  .hero h1{font-size:2rem}
  .content{padding:16px 20px 80px}
  #map{height:300px}
}

/* ═══════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════ */
let map = null, mapMarkers = [], currentDay = 0;

// ── City tabs ──
function renderCityNav(){
  const c = document.getElementById('cityNav');
  c.innerHTML = '';
  CITIES.forEach((ct, ci) => {
    const days = DAYS.filter(d => d.cityIdx === ci);
    const btn = document.createElement('button');
    btn.className = 'city-btn' + (ci === 0 ? ' active' : '');
    btn.innerHTML = ct.name + '<span class="city-day">第 ' + days[0].d + '-' + days[days.length-1].d + ' 天</span>';
    btn.style.color = ci === 0 ? '#2c2c2c' : '#bbb';
    btn.onclick = () => { switchCity(ci); };
    c.appendChild(btn);
  });
}

// ── Day pills ──
function renderDayStrip(activeCityIdx){
  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  const days = DAYS.filter(d => d.cityIdx === activeCityIdx);
  days.forEach((day, idx) => {
    const pill = document.createElement('button');
    pill.className = 'day-pill' + (idx === 0 ? ' active' : '');
    pill.innerHTML = '第' + day.d + '天 <span class="dow">' + day.dow + '</span>';
    pill.onclick = () => {
      const globalIdx = DAYS.indexOf(day);
      switchDay(globalIdx);
    };
    strip.appendChild(pill);
  });
}

// ── Map ──
function initMap(){
  if(typeof L === 'undefined' || !L.map){
    document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:.82rem">地图加载失败</div>';
    return;
  }
  try {
    map = L.map('map', {zoomControl: true, attributionControl: false}).setView([31.0, 119.8], 8);
    L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      maxZoom: 18,
      attribution: ''
    }).addTo(map);
  } catch(e) {
    document.getElementById('map').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:.82rem">地图加载失败</div>';
    map = null;
  }
}

function updateMap(dayIdx){
  if(!map) return;
  mapMarkers.forEach(m => map.removeLayer(m));
  mapMarkers = [];
  const day = DAYS[dayIdx];
  const pts = day.items.filter(it => it.lat && it.lng);
  if(pts.length === 0){
    const cc = [[32.06,118.80],[30.27,120.16],[31.32,120.62],[31.23,121.47]];
    map.setView(cc[day.cityIdx], 12);
    return;
  }
  const bounds = [];
  pts.forEach(p => {
    try {
      const mkr = L.marker([p.lat, p.lng]).addTo(map);
      mkr.bindTooltip(p.name, {direction:'top', offset:[0,-10]});
      mapMarkers.push(mkr);
      bounds.push([p.lat, p.lng]);
    } catch(e){}
  });
  if(bounds.length === 1) map.setView(bounds[0], 14);
  else if(bounds.length > 1) map.fitBounds(bounds, {padding:[40,40], maxZoom:15});
  setTimeout(() => { try{map.invalidateSize();}catch(e){} }, 300);
}

// ── Cards ──
function renderCards(dayIdx){
  const container = document.getElementById('content');
  container.innerHTML = '';
  DAYS.forEach((day, di) => {
    const block = document.createElement('div');
    block.className = 'day-block' + (di === dayIdx ? ' active' : '');
    let html = '';
    day.items.forEach(item => {
      html += '<div class="card">';
      // Header
      let emoji, label, tagClass;
      if(item.type === 'hotel') { emoji='🏨'; label='住宿'; tagClass='tag-hotel'; }
      else if(item.type === 'food') { emoji='🍜'; label=item.title; tagClass='tag-food'; }
      else if(item.type === 'sight') { emoji='📍'; label='游玩'; tagClass='tag-sight'; }
      else { emoji='🚄'; label='交通'; tagClass='tag-transit'; }
      html += '<div class="card-hd"><span class="emoji">'+emoji+'</span><span class="label">'+label+'</span>';
      if(item.tag === 'main') html += '<span class="tag tag-food">主推</span>';
      else if(item.tag === 'alt') html += '<span class="tag" style="background:#f0f0f0;color:#888">备选</span>';
      html += '</div>';
      // Body
      html += '<div class="card-bd">';
      if(item.type === 'food'){
        html += '<div class="card-title">'+item.name+'</div>';
        html += '<div class="card-sub">'+item.cui+' · '+item.price+'</div>';
        if(item.dp) html += '<div class="review"><strong>🍜 大众点评：</strong>'+item.dp+'</div>';
        if(item.xhs) html += '<div class="review"><strong>📕 小红书：</strong>'+item.xhs+'</div>';
        // Actions
        html += '<div class="actions">';
        var q = encodeURIComponent(item.name+day.cityIdx);
        html += '<a class="act" href="https://maps.apple.com/?q='+encodeURIComponent(item.name)+'" target="_blank"><span class="ico">🗺️</span> 导航</a>';
        html += '<a class="act" href="https://uri.amap.com/search?keyword='+encodeURIComponent(item.name)+'" target="_blank"><span class="ico">🧭</span> 高德</a>';
        html += '<a class="act" href="xhsdiscover://search/notes?keyword='+encodeURIComponent(item.name)+'" onclick="return xhsCk(this,\''+encodeURIComponent(item.name)+'\')"><span class="ico">📕</span> 小红书</a>';
        if(item.dianping !== false){
          var dpk = encodeURIComponent(item.dpk || item.name);
          html += '<a class="act" href="dianping://search?keyword='+dpk+'" onclick="return dpFb(this,\''+dpk+'\')"><span class="ico">🍜</span> 点评</a>';
        }
        if(item.booking) html += '<a class="act primary" href="'+item.booking.url+'" target="_blank"><span class="ico">📅</span> '+item.booking.text+'</a>';
        html += '</div>';
        // Pay tags
        if(item.pay && item.pay.length){
          html += '<div class="pays">';
          var pl = ['💳 信用卡','📱 支付宝','🚇 交通卡','💰 现金'];
          var pc = ['cc','alipay','card','cash'];
          item.pay.forEach(function(pi){
            html += '<span class="pay '+pc[pi]+'">'+pl[pi]+'</span>';
          });
          html += '</div>';
        }
      } else if(item.type === 'hotel'){
        html += '<div class="card-title">'+item.title+'</div>';
        if(item.note) html += '<div style="font-size:.8rem;color:#888;margin-top:6px">💡 '+item.note+'</div>';
      } else if(item.type === 'sight'){
        html += '<div class="sight-text">'+item.detail+'</div>';
      } else if(item.type === 'transit'){
        html += '<div class="card-title">'+item.title+'</div>';
        if(item.note) html += '<div style="font-size:.8rem;color:#888;margin-top:6px">💡 '+item.note+'</div>';
      }
      html += '</div></div>';
    });
    block.innerHTML = html;
    container.appendChild(block);
  });
}

// ── Navigation ──
function switchCity(ci){
  // Update city tabs
  document.querySelectorAll('.city-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === ci);
    btn.style.color = i === ci ? '#2c2c2c' : '#bbb';
  });
  // Find first day of this city
  const firstDay = DAYS.findIndex(d => d.cityIdx === ci);
  switchDay(firstDay >= 0 ? firstDay : 0);
}

function switchDay(di){
  currentDay = di;
  const day = DAYS[di];
  // Update day pills
  const strip = document.getElementById('dayStrip');
  const pills = strip.querySelectorAll('.day-pill');
  const cityDays = DAYS.filter(d => d.cityIdx === day.cityIdx);
  const localIdx = cityDays.indexOf(day);
  pills.forEach((p, i) => p.classList.toggle('active', i === localIdx));
  // Cards
  document.querySelectorAll('.day-block').forEach((b, i) => b.classList.toggle('active', i === di));
  // Map
  updateMap(di);
  // Scroll to top
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ── App links ──
function xhsCk(el, q){
  var ua = navigator.userAgent.toLowerCase();
  if(/MicroMessenger|QQ|TouTiao|aweme/i.test(ua)){
    el.href = 'https://www.xiaohongshu.com/search_result?keyword='+decodeURIComponent(q);
    return true;
  }
  el.href = 'xhsdiscover://search/notes?keyword='+q;
  setTimeout(function(){ window.location.href = 'https://www.xiaohongshu.com/search_result?keyword='+decodeURIComponent(q); }, 800);
  return true;
}
function dpFb(el, q){
  setTimeout(function(){ window.location.href = 'https://m.dianping.com/search/keyword/'+decodeURIComponent(q); }, 800);
  return true;
}

// ── Boot ──
function boot(){
  renderCityNav();
  renderDayStrip(0);
  initMap();
  renderCards(0);
  setTimeout(() => { try{map && map.invalidateSize();}catch(e){} }, 500);
}
if(document.readyState === 'complete' || document.readyState === 'interactive') boot();
else document.addEventListener('DOMContentLoaded', boot);
</script>
